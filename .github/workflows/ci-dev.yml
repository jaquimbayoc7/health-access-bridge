on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests (Dev)
    runs-on: ubuntu-26.04
    environment: development

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hab_user
          POSTGRES_PASSWORD: hab_password
          POSTGRES_DB: hab_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-test.txt

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://hab_user:hab_password@localhost:5432/hab_dev
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENVIRONMENT: development
        run: cd backend && pytest app/tests/ -v --tb=short

  frontend-build:
    name: Frontend Build (Dev)
    runs-on: ubuntu-26.04
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verificar sincronia package.json / package-lock.json
        run: |
          cd frontend
          if ! npm ci --dry-run; then
            echo "::error::package-lock.json esta desincronizado con package.json. Corre 'npm install' en frontend/ y commitea el lockfile actualizado."
            exit 1
          fi

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend unit tests (HU-13)
        run: cd frontend && npm run test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://hab-backend-dev.onrender.com
          VITE_ENVIRONMENT: development
        run: cd frontend && npm run build

  notify-dev-ready:
    name: Notify DEV deploy ready
    runs-on: ubuntu-26.04
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: DEV environment ready
        run: |
          echo "âœ… CI passed on develop."
          echo "ðŸš€ Render will auto-deploy to DEV environment."
          echo "ðŸ“‹ Next step: open a PR from develop â†’ staging and request approval to promote to QA."
          echo "   URL DEV backend: https://hab-backend-dev.onrender.com"
          echo "   URL DEV frontend: https://hab-frontend-dev.onrender.com"
