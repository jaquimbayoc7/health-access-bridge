name: CI/CD - Production

# ──────────────────────────────────────────────────────────────────────────
# STAGE 3 — PRODUCTION
# Trigger: PR staging→master (aprobación requerida) o push a master
# Requisito previo: QA gate aprobado (promote-to-production-gate en ci-qa.yml)
# Pasos:
#   1. CI unit tests finales (Python 3.11)
#   2. Aprobación manual obligatoria (environment gate "production")
#   3. Tras aprobar, este workflow dispara el deploy en Render (deploy hooks)
#   4. Smoke tests contra PROD (backend y frontend)
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests (Prod)
    runs-on: ubuntu-26.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hab_user
          POSTGRES_PASSWORD: hab_password
          POSTGRES_DB: hab_prod_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-test.txt

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://hab_user:hab_password@localhost:5432/hab_prod_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENVIRONMENT: production
        run: cd backend && pytest app/tests/ -v --tb=short

  frontend-build:
    name: Frontend Build (Prod)
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verificar sincronia package.json / package-lock.json
        run: |
          cd frontend
          if ! npm ci --dry-run; then
            echo "::error::package-lock.json esta desincronizado con package.json. Corre 'npm install' en frontend/ y commitea el lockfile actualizado."
            exit 1
          fi

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend unit tests (HU-13)
        run: cd frontend && npm run test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://hab-backend-szj1.onrender.com
          VITE_ENVIRONMENT: production
        run: cd frontend && npm run build

  deploy-approval:
    name: "🔐 Approval Gate — Deploy to Production"
    runs-on: ubuntu-26.04
    environment: production
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Trigger Render PROD deploy hooks (backend + frontend)
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_PROD_BACKEND }}
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_PROD_FRONTEND }}
        run: |
          for NAME in HOOK_BACKEND HOOK_FRONTEND; do
            URL="${!NAME}"
            if [ -z "$URL" ]; then
              echo "::error::Falta el secret de $NAME (RENDER_DEPLOY_HOOK_PROD_*). Crealo en Settings > Environments > production."
              exit 1
            fi
            curl -fsS -X POST "$URL" > /dev/null
            echo "Deploy disparado: $NAME"
          done
          echo "   URL PROD backend:  https://hab-backend-szj1.onrender.com"
          echo "   URL PROD frontend: https://hab-frontend.onrender.com"

  api-smoke-tests-prod:
    name: API Smoke Tests — Render PROD
    runs-on: ubuntu-26.04
    needs: [deploy-approval]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Wait for Render PROD to be healthy (up to 10 min)
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hab-backend-szj1.onrender.com/health || true)
            echo "Intento $i: /health -> $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Render PROD no respondio 200 en /health tras 10 minutos"
          exit 1

      - name: Health check — /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hab-backend-szj1.onrender.com/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Production health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ /health OK"

      - name: Smoke test — POST /users/login reachable
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://hab-backend-szj1.onrender.com/users/login \
            -H "Content-Type: application/json" \
            -d '{"username":"smoke@test.com","password":"smoke"}')
          echo "Login endpoint status: $STATUS"
          if [ "$STATUS" != "422" ] && [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ]; then
            echo "❌ Auth endpoint unreachable in PROD (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ /users/login reachable in PROD"

      - name: Smoke test — frontend PROD returns 200
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hab-frontend.onrender.com/ || true)
            echo "Intento $i: frontend -> $STATUS"
            [ "$STATUS" = "200" ] && { echo "✅ Frontend PROD OK"; exit 0; }
            sleep 10
          done
          echo "::error::Frontend PROD no respondio 200"
          exit 1
